name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk MemoryStamp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryStamp-apk
          path: MemoryStamp.apk
      # Latest build of each branch, downloadable without signing in to GitHub.
      - if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name == 'main' && 'main' || 'dev' }}
          name: Memory Stamp (bản build mới nhất ${{ github.ref_name }})
          prerelease: true
          files: MemoryStamp.apk
